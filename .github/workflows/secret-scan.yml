name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read
  # gitleaks-action fetches the PR's commit list via the GitHub API on
  # pull_request events (an incremental scan of just those commits, not
  # the whole history) — without this the job 403s before it scans
  # anything, which reads as a check failure with zero information about
  # whether a secret was actually found.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub *organization* accounts.
          # This repo is under a personal account, so no license key is needed.
