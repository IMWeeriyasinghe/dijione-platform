name: secret-scan

# gitleaks on every pushed commit, on every branch. A pull request's commits
# are pushed to its branch first, so the push scan covers them and its
# `gitleaks` check appears on the PR head; a separate pull_request run would
# scan the same commits a second time (it did until 2026-11, doubling the
# minutes). The weekly and manual runs scan the FULL history, which the
# incremental push scan does not. docs/platform/ci-operations.md.

on:
  push:
  # GitHub runs schedules from the DEFAULT branch's copy of this file only.
  schedule:
    - cron: "30 3 * * 1"   # weekly, Monday 03:30 UTC — full-history scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub *organization* accounts.
          # This repo is under a personal account, so no license key is needed.
