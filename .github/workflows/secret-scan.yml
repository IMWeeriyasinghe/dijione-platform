name: secret-scan

# gitleaks on every pushed commit (push) AND on every pull request's full
# commit range against its base (pull_request — the required PR check). The
# push scan alone is NOT equivalent: a push whose commits already exist in
# the repo reports "No commits to scan", so the PR scan is kept deliberately
# even though it costs extra minutes. The weekly and manual runs scan the
# FULL history. docs/platform/ci-operations.md.

on:
  push:
  pull_request:
  # GitHub runs schedules from the DEFAULT branch's copy of this file only.
  schedule:
    - cron: "30 3 * * 1"   # weekly, Monday 03:30 UTC — full-history scan
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists the PR's commits via the API on pull_request events.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub *organization* accounts.
          # This repo is under a personal account, so no license key is needed.
