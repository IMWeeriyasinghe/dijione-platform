name: postgres

# Real-PostgreSQL verification for every service that owns a database
# (Architecture Completion Plan Wave D / Wave H-local). Local dev + the
# `api` / `migrations` workflows stay on SQLite for speed; this job proves
# migrations apply and the full suite passes against Postgres 16 — the
# production engine (Azure Database for PostgreSQL Flexible Server).
#
# The `_dev`-suffixed database names in the matrix below (platform_dev,
# talent_dev, ...) are INTENTIONALLY environment-agnostic and unrelated to
# any real DEV/UAT/PROD Azure database. This job spins up a throwaway
# `postgres:16` service container per matrix run that exists only for the
# duration of this CI job and is discarded afterward — it never connects to
# `psql-dijione-<env>` or any other real, hosted server. Reviewed as part of
# the deploy/bicep environment-awareness fix (foundation.bicep/main.bicep/
# init-secrets.sh) and deliberately left unchanged: these are ephemeral CI
# database names, not an infrastructure environment leak.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/*-api/**"
      - "packages/auth-client-py/**"
      - ".github/workflows/postgres.yml"
      - ".github/actions/ci-scope/**"
      - "scripts/ci/**"
  # Manual full run (every leg), e.g. on a release branch before promotion.
  workflow_dispatch:

concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Change-aware: on a pull request only the legs whose inputs changed run
# (scripts/ci/ci-scope.js); push, schedule and manual runs run every leg.
# `postgres-result` is the single required context that proves it.
jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pg: ${{ steps.scope.outputs.pg }}
      run_pg: ${{ steps.scope.outputs.run_pg }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          workflow: postgres
          spec: |
            {
              "pg": {
                "shared": ["python"],
                "matrix": [
                  {"service": "platform-api", "db": "platform_dev"},
                  {"service": "talent-api", "db": "talent_dev"},
                  {"service": "recruitment-api", "db": "recruitment_dev"},
                  {"service": "people-api", "db": "people_dev"},
                  {"service": "commercial-api", "db": "commercial_dev"},
                  {"service": "birthday-api", "db": "birthday_dev"}
                ]
              }
            }

  pg:
    needs: scope
    if: needs.scope.outputs.run_pg == 'true'
    name: pg (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.pg) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dijione
          POSTGRES_PASSWORD: dijione
          POSTGRES_DB: ${{ matrix.db }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dijione"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    env:
      INTEGRATIONS_MODE: mock
      EMAIL_SENDING_MODE: mock
      # psycopg 3 dialect — the same URL shape deploy/README.md documents.
      DATABASE_URL: postgresql+psycopg://dijione:dijione@localhost:5432/${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: alembic upgrade head (real Postgres)
        run: alembic upgrade head

      - name: alembic downgrade base / upgrade head (idempotency)
        run: |
          alembic downgrade base || echo "no reversible chain — continuing"
          alembic upgrade head

      - name: Pytest (real Postgres)
        # each service's tests/conftest.py does
        # `os.environ.setdefault("DATABASE_URL", <sqlite>)`, so with
        # DATABASE_URL exported above the whole suite runs against Postgres.
        run: pytest -q

  postgres-result:
    needs: [scope, pg]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Every in-scope leg ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-scope.js verify
