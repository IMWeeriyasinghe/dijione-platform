name: web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/*-web/**"
      - "apps/talent-api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/web.yml"
      - ".github/actions/ci-scope/**"
      - "scripts/ci/**"
  # Manual full run (every leg), e.g. on a release branch before promotion.
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Change-aware: on a pull request only the legs whose inputs changed run
# (scripts/ci/ci-scope.js); push, schedule and manual runs run every leg.
# `web-result` is the single required context that proves it.
jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lint_build: ${{ steps.scope.outputs.lint_build }}
      run_lint_build: ${{ steps.scope.outputs.run_lint_build }}
      e2e: ${{ steps.scope.outputs.e2e }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          workflow: web
          # shell-web's regression test reads deploy/ (Dockerfile.web, Bicep).
          # The e2e legs start talent-api, so its code and the shared Python
          # inputs are e2e inputs too.
          spec: |
            {
              "lint-build": {
                "shared": ["node"],
                "matrix": [
                  {"app": "shell-web", "also": ["deploy/**"]},
                  {"app": "admin-web"},
                  {"app": "talent-web"},
                  {"app": "talentflow-portal-web"},
                  {"app": "birthday-web"},
                  {"app": "birthday-supplier-web"},
                  {"app": "onsite-web"},
                  {"app": "atwork-web"}
                ]
              },
              "e2e": {
                "shared": ["node", "python"],
                "also": ["apps/talent-api/**"],
                "matrix": [
                  {"app": "talent-web"},
                  {"app": "talentflow-portal-web"}
                ]
              }
            }

  lint-build:
    needs: scope
    if: needs.scope.outputs.run_lint_build == 'true'
    name: lint-build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.lint_build) }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm --workspace apps/${{ matrix.app }} run lint

      - name: Test
        run: npm --workspace apps/${{ matrix.app }} run test --if-present

      - name: Build
        run: npm --workspace apps/${{ matrix.app }} run build

  e2e:
    needs: scope
    if: needs.scope.outputs.run_e2e == 'true'
    name: e2e (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.e2e) }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install talent-api
        working-directory: apps/talent-api
        run: pip install -r requirements.txt

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm --workspace apps/${{ matrix.app }} run test:e2e

  web-result:
    needs: [scope, lint-build, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Every in-scope leg ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-scope.js verify
