name: web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/*-web/**"
      - "apps/talent-api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - shell-web
          - admin-web
          - talent-web
          - talentflow-portal-web
          - birthday-web
          - birthday-supplier-web
          - onsite-web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm --workspace apps/${{ matrix.app }} run lint

      - name: Test
        run: npm --workspace apps/${{ matrix.app }} run test --if-present

      - name: Build
        run: npm --workspace apps/${{ matrix.app }} run build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - talent-web
          - talentflow-portal-web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install talent-api
        working-directory: apps/talent-api
        run: pip install -r requirements.txt

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm --workspace apps/${{ matrix.app }} run test:e2e
