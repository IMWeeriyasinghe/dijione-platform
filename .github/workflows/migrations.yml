name: migrations

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/platform-api/alembic/**"
      - "apps/talent-api/alembic/**"
      - "apps/recruitment-api/alembic/**"
      - "apps/people-api/alembic/**"
      - "apps/birthday-api/alembic/**"
      - "apps/onsite-api/alembic/**"
      - "apps/atwork-api/alembic/**"
      - "apps/*-api/app/models/**"
      - ".github/workflows/migrations.yml"
      - ".github/actions/ci-scope/**"
      - "scripts/ci/**"
  # Manual full run (every leg), e.g. on a release branch before promotion.
  workflow_dispatch:

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Change-aware: on a pull request only the legs whose inputs changed run
# (scripts/ci/ci-scope.js); push, schedule and manual runs run every leg.
# `migrations-result` is the single required context that proves it.
jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      upgrade: ${{ steps.scope.outputs.upgrade }}
      run_upgrade: ${{ steps.scope.outputs.run_upgrade }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          workflow: migrations
          # A leg runs on any change to its service (requirements, models,
          # alembic) or a shared Python input — wider than the trigger paths.
          spec: |
            {
              "upgrade": {
                "shared": ["python"],
                "matrix": [
                  {"service": "platform-api"},
                  {"service": "talent-api"},
                  {"service": "recruitment-api"},
                  {"service": "people-api"},
                  {"service": "commercial-api"},
                  {"service": "birthday-api"},
                  {"service": "onsite-api"},
                  {"service": "atwork-api"}
                ]
              }
            }

  upgrade:
    needs: scope
    if: needs.scope.outputs.run_upgrade == 'true'
    name: upgrade (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.upgrade) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    env:
      INTEGRATIONS_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: alembic upgrade head (fresh SQLite)
        run: alembic upgrade head

  migrations-result:
    needs: [scope, upgrade]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Every in-scope leg ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-scope.js verify
