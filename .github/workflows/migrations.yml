name: migrations

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/platform-api/alembic/**"
      - "apps/talent-api/alembic/**"
      - "apps/recruitment-api/alembic/**"
      - "apps/birthday-api/alembic/**"
      - "apps/*-api/app/models/**"
      - ".github/workflows/migrations.yml"

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - platform-api
          - talent-api
          - recruitment-api
          - birthday-api
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    env:
      INTEGRATIONS_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: alembic upgrade head (fresh SQLite)
        run: alembic upgrade head
