name: api

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/*-api/**"
      - "packages/auth-client-py/**"
      - "packages/mail-client-py/**"
      - ".python-version"
      - ".github/workflows/api.yml"
      - ".github/actions/ci-scope/**"
      - "scripts/ci/**"
  # Manual full run (every leg), e.g. on a release branch before promotion.
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Change-aware: on a pull request only the legs whose inputs changed run
# (scripts/ci/ci-scope.js); push, schedule and manual runs run every leg.
# `api-result` is the single required context that proves it.
jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lint_test: ${{ steps.scope.outputs.lint_test }}
      run_lint_test: ${{ steps.scope.outputs.run_lint_test }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          workflow: api
          # Every leg of lint-test. A leg runs when apps/<service>/**, a shared
          # Python input, or one of its `also` paths changes.
          spec: |
            {
              "lint-test": {
                "shared": ["python"],
                "matrix": [
                  {"service": "platform-api"},
                  {"service": "admin-api"},
                  {"service": "talent-api"},
                  {"service": "recruitment-api"},
                  {"service": "people-api"},
                  {"service": "commercial-api"},
                  {"service": "birthday-api"},
                  {"service": "spark-api"},
                  {"service": "onsite-api", "also": ["apps/onsite-web/src/__tests__/fixtures/**"]},
                  {"service": "atwork-api"}
                ]
              }
            }

  lint-test:
    needs: scope
    if: needs.scope.outputs.run_lint_test == 'true'
    name: lint-test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.lint_test) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    env:
      # Never let a test reach a real external system.
      INTEGRATIONS_MODE: mock
      EMAIL_SENDING_MODE: mock
      MAIL_TRANSPORT: "null"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  api-result:
    needs: [scope, lint-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Every in-scope leg ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-scope.js verify
