name: api

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/*-api/**"
      - "packages/auth-client-py/**"
      - ".python-version"
      - ".github/workflows/api.yml"

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      platform-api: ${{ steps.filter.outputs.platform-api }}
      admin-api: ${{ steps.filter.outputs.admin-api }}
      talent-api: ${{ steps.filter.outputs.talent-api }}
      recruitment-api: ${{ steps.filter.outputs.recruitment-api }}
      people-api: ${{ steps.filter.outputs.people-api }}
      commercial-api: ${{ steps.filter.outputs.commercial-api }}
      birthday-api: ${{ steps.filter.outputs.birthday-api }}
      spark-api: ${{ steps.filter.outputs.spark-api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            platform-api:
              - 'apps/platform-api/**'
              - 'packages/auth-client-py/**'
              - '.python-version'
            admin-api:
              - 'apps/admin-api/**'
              - 'packages/auth-client-py/**'
              - '.python-version'
            talent-api:
              - 'apps/talent-api/**'
              - 'packages/auth-client-py/**'
              - '.python-version'
            recruitment-api:
              - 'apps/recruitment-api/**'
              - 'packages/auth-client-py/**'
              - '.python-version'
            people-api:
              - 'apps/people-api/**'
              - 'packages/auth-client-py/**'
              - '.python-version'
            commercial-api:
              - 'apps/commercial-api/**'
              - 'packages/auth-client-py/**'
              - '.python-version'
            birthday-api:
              - 'apps/birthday-api/**'
              - 'packages/auth-client-py/**'
              - '.python-version'
            spark-api:
              - 'apps/spark-api/**'
              - 'packages/auth-client-py/**'
              - '.python-version'

  lint-test:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - platform-api
          - admin-api
          - talent-api
          - recruitment-api
          - people-api
          - commercial-api
          - birthday-api
          - spark-api
    if: needs.detect.outputs[matrix.service] == 'true'
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    env:
      # Never let a test reach a real external system.
      INTEGRATIONS_MODE: mock
      EMAIL_SENDING_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
