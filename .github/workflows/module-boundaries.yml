name: module-boundaries

# Module-independence gate for Diji On-site and DijiAtWork
# (docs/onsite/module-removal.md, docs/atwork/module-removal.md). Intended as a REQUIRED status check:
#   1. guard   — no On-site references outside its own apps and the
#                allow-listed registration points (zero tolerance elsewhere);
#   2. removal — physically delete apps/onsite-api + apps/onsite-web, then
#                prove every remaining service still tests, migrates and builds.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: module-boundaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `guard` runs on every event, unconditionally: it is the cheap static gate
# that stops any new cross-module reference. The removal jobs are
# change-aware on a pull request (scripts/ci/ci-scope.js): a leg proves that
# its own service/app still works with the module removed, so it re-runs
# only when that service/app, a shared input of its kind, or the guard
# script changes. Push to main, the weekly schedule and manual runs always
# run every leg. `module-boundaries-result` is the single required context.
jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      removal_api: ${{ steps.scope.outputs.removal_api }}
      run_removal_api: ${{ steps.scope.outputs.run_removal_api }}
      run_removal_web: ${{ steps.scope.outputs.run_removal_web }}
      atwork_removal_api: ${{ steps.scope.outputs.atwork_removal_api }}
      run_atwork_removal_api: ${{ steps.scope.outputs.run_atwork_removal_api }}
      run_atwork_removal_web: ${{ steps.scope.outputs.run_atwork_removal_web }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci
      - id: scope
        uses: ./.github/actions/ci-scope
        with:
          workflow: module-boundaries
          # The removal-web jobs build shell-web (whose test reads deploy/)
          # and run the guard script, so both are their inputs.
          spec: |
            {
              "removal-api": {
                "shared": ["python"],
                "matrix": [
                  {"service": "platform-api"},
                  {"service": "people-api"},
                  {"service": "birthday-api"},
                  {"service": "talent-api"},
                  {"service": "admin-api"},
                  {"service": "recruitment-api"},
                  {"service": "atwork-api"}
                ]
              },
              "removal-web": {
                "shared": ["node"],
                "also": ["deploy/**", "scripts/check-module-independence.js"],
                "apps": ["shell-web", "admin-web", "talent-web", "talentflow-portal-web",
                         "birthday-web", "birthday-supplier-web", "atwork-web"]
              },
              "atwork-removal-api": {
                "shared": ["python"],
                "matrix": [
                  {"service": "platform-api"},
                  {"service": "people-api"},
                  {"service": "birthday-api"},
                  {"service": "talent-api"},
                  {"service": "admin-api"},
                  {"service": "recruitment-api"},
                  {"service": "onsite-api", "also": ["apps/onsite-web/src/__tests__/fixtures/**"]}
                ]
              },
              "atwork-removal-web": {
                "shared": ["node"],
                "also": ["deploy/**", "scripts/check-module-independence.js"],
                "apps": ["shell-web", "admin-web", "talent-web", "talentflow-portal-web",
                         "birthday-web", "birthday-supplier-web", "onsite-web"]
              }
            }

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Guard self-test
        run: node --test scripts/check-module-independence.test.js
      - name: No On-site references outside its module and registration points
        run: node scripts/check-module-independence.js

  removal-api:
    needs: scope
    if: needs.scope.outputs.run_removal_api == 'true'
    name: removal-api (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.removal_api) }}
    env:
      INTEGRATIONS_MODE: mock
      EMAIL_SENDING_MODE: mock
      MAIL_TRANSPORT: "null"
    steps:
      - uses: actions/checkout@v4
      - name: Remove the Diji On-site module
        run: rm -rf apps/onsite-api apps/onsite-web
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements.txt
      - name: Install
        working-directory: apps/${{ matrix.service }}
        run: pip install -r requirements.txt
      - name: Pytest (module removed)
        working-directory: apps/${{ matrix.service }}
        run: pytest -q
      - name: alembic upgrade head on a fresh database (module removed)
        working-directory: apps/${{ matrix.service }}
        run: |
          if [ -d alembic ]; then
            DATABASE_URL="sqlite:///./removal-check.db" alembic upgrade head
          else
            echo "no database for ${{ matrix.service }}"
          fi

  removal-web:
    needs: scope
    if: needs.scope.outputs.run_removal_web == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Remove the Diji On-site module and its workspace entry
        run: |
          rm -rf apps/onsite-api apps/onsite-web
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.workspaces=p.workspaces.filter(w=>!w.startsWith('apps/onsite-'));fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - run: npm install --no-audit --no-fund
      - name: Build every remaining web app (module removed)
        run: |
          for app in shell-web admin-web talent-web talentflow-portal-web birthday-web birthday-supplier-web atwork-web; do
            echo "::group::$app"
            npm --workspace apps/$app run test --if-present
            npm --workspace apps/$app run build
            echo "::endgroup::"
          done
      - name: Guard still clean with the module removed
        run: node scripts/check-module-independence.js

  # DijiAtWork removal gate (docs/atwork/module-removal.md). Separate jobs so
  # the names of the Diji On-site checks above stay unchanged.
  atwork-removal-api:
    needs: scope
    if: needs.scope.outputs.run_atwork_removal_api == 'true'
    name: atwork-removal-api (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.atwork_removal_api) }}
    env:
      INTEGRATIONS_MODE: mock
      EMAIL_SENDING_MODE: mock
      MAIL_TRANSPORT: "null"
    steps:
      - uses: actions/checkout@v4
      - name: Remove the DijiAtWork module
        run: rm -rf apps/atwork-api apps/atwork-web
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements.txt
      - name: Install
        working-directory: apps/${{ matrix.service }}
        run: pip install -r requirements.txt
      - name: Pytest (module removed)
        working-directory: apps/${{ matrix.service }}
        run: pytest -q
      - name: alembic upgrade head on a fresh database (module removed)
        if: matrix.service != 'admin-api'
        working-directory: apps/${{ matrix.service }}
        run: DATABASE_URL="sqlite:///./removal-check.db" alembic upgrade head

  atwork-removal-web:
    needs: scope
    if: needs.scope.outputs.run_atwork_removal_web == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Remove the DijiAtWork module and its workspace entry
        run: |
          rm -rf apps/atwork-api apps/atwork-web
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.workspaces=p.workspaces.filter(w=>!w.startsWith('apps/atwork-'));fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - run: npm install --no-audit --no-fund
      - name: Build every remaining web app (module removed)
        run: |
          for app in shell-web admin-web talent-web talentflow-portal-web birthday-web birthday-supplier-web onsite-web; do
            echo "::group::$app"
            npm --workspace apps/$app run test --if-present
            npm --workspace apps/$app run build
            echo "::endgroup::"
          done
      - name: Guard still clean with the module removed
        run: node scripts/check-module-independence.js

  module-boundaries-result:
    needs: [scope, guard, removal-api, removal-web, atwork-removal-api, atwork-removal-web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Guard passed and every in-scope removal leg ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-scope.js verify
