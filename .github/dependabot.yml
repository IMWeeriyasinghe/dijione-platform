version: 2

# Dependabot reads this file from the DEFAULT branch only and opens its PRs
# against the default branch (docs/platform/ci-operations.md). Version
# updates are monthly and grouped so each ecosystem produces at most one
# minor/patch PR per month — every PR costs change-aware CI minutes on a
# private repository. Security alerts are a separate repository setting.
# rebase-strategy: disabled — Dependabot does not auto-rebase its open PRs
# when the base moves (each rebase re-runs CI); comment `@dependabot rebase`
# on a PR to refresh it, and newer grouped PRs supersede older ones.
updates:
  # Frontend workspaces + shared TS packages (single npm tree at the repo root)
  - package-ecosystem: npm
    directory: /
    rebase-strategy: disabled
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions (keeps action majors off deprecated runtimes). Quarterly:
  # an Actions bump edits the workflows, which forces a ~95-minute full run.
  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: disabled
    schedule:
      interval: quarterly
    groups:
      github-actions:
        patterns: ["*"]

  # Every Python service and shared Python package. Globs keep new services
  # covered automatically and keep module names out of this file.
  - package-ecosystem: pip
    directories:
      - "/apps/*-api"
      - "/packages/*-py"
    rebase-strategy: disabled
    schedule:
      interval: monthly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
