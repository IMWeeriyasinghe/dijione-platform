name: ci-scope
description: >-
  Change-aware CI scoping. Reads the pull request's changed files and decides
  which of the calling workflow's matrix legs must run (scripts/ci/ci-scope.js).
  Anything that is not a pull_request event, or any doubt about the diff,
  runs every leg. Needs `pull-requests: read` and a checkout that includes
  .github/actions and scripts/ci.

inputs:
  workflow:
    description: Calling workflow's file name without extension (e.g. api).
    required: true
  spec:
    description: JSON object of the workflow's scoped jobs and their legs.
    required: true

outputs:
  mode:
    description: '"full" or "scoped".'
    value: ${{ steps.scope.outputs.mode }}

runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPO: ${{ github.repository }}
        WORKFLOW: ${{ inputs.workflow }}
        CI_SCOPE_SPEC: ${{ inputs.spec }}
      run: |
        set -uo pipefail
        args=(scope --workflow "$WORKFLOW" --event "$EVENT")
        if [ "$EVENT" = "pull_request" ]; then
          list="$RUNNER_TEMP/ci-scope-changed-files.txt"
          # Both sides of a rename count: moving a file out of an app changes it too.
          if gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
               --jq '.[] | .filename, (.previous_filename // empty)' > "$list"; then
            args+=(--changed-files "$list")
            # Lockfile at the merge base and at the head, so a per-app version
            # bump is not mistaken for a shared dependency change. Any failure
            # here simply leaves the full Node fan-out in place.
            if grep -qx 'package-lock.json' "$list"; then
              raw='Accept: application/vnd.github.raw'
              if mb=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.merge_base_commit.sha') \
                 && gh api -H "$raw" "repos/$REPO/contents/package-lock.json?ref=$mb" > "$RUNNER_TEMP/lock-base.json" \
                 && gh api -H "$raw" "repos/$REPO/contents/package-lock.json?ref=$HEAD_SHA" > "$RUNNER_TEMP/lock-head.json"; then
                args+=(--lockfile-base "$RUNNER_TEMP/lock-base.json" --lockfile-head "$RUNNER_TEMP/lock-head.json")
              fi
            fi
          else
            echo "::warning::Could not list the PR's changed files; running every leg."
            args+=(--diff-unavailable)
          fi
        fi
        node "$GITHUB_WORKSPACE/scripts/ci/ci-scope.js" "${args[@]}"
