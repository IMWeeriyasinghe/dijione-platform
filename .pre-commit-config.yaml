# Install once:  pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
#
# Purpose: block secrets and obvious mistakes before they are committed.
# Style/lint is enforced by CI (ruff, eslint) — not duplicated here to avoid
# reformatting churn.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
